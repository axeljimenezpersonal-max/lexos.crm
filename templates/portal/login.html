<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Portal — {{ tenant.nombre_despacho if tenant else 'LexOS' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body class="ptl-login-body">
  <div class="ptl-login-card">
    {% if tenant and tenant.logo_url %}
    <img src="{{ tenant.logo_url }}" alt="" class="ptl-login-logo">
    {% endif %}
    <h1 class="ptl-login-title">{{ tenant.nombre_despacho if tenant else 'LexOS' }}</h1>
    <p class="ptl-login-sub">Portal de Clientes</p>

    {% if error %}
    <div class="ptl-alert ptl-alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('portal.cliente_auth') }}" class="ptl-login-form">
      <div class="ptl-field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required autofocus>
      </div>
      <div class="ptl-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña">
      </div>
      <button type="submit" class="ptl-btn-login">Iniciar sesión</button>
    </form>

    <p class="ptl-login-hint">Si no tienes contraseña, solicita a tu abogado un link de acceso.</p>

    <div class="ptl-login-brand">Powered by <strong>LexOS</strong></div>
  </div>
</body>
</html>
