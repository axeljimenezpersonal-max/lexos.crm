{% from "components/icons.html" import icon_lock %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/favicon.svg') }}">
<title>Enlace expirado — Habeas Corpus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #F8F6F2; color: #142E59; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
  .card { background: #FCFAF7; border: 1px solid #E5E2DB; border-top: 3px solid #AD9060; border-radius: 16px; padding: 44px 36px; max-width: 420px; width: 100%; box-shadow: 0 16px 34px -28px rgba(20,46,89,.45); }
  .icon { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: #F4EEDF; color: #8A6A2F; margin-bottom: 16px; }
  h1 { font: 600 1.3rem 'Sora', sans-serif; margin-bottom: 8px; }
  p { color: #60718D; font-size: .9rem; line-height: 1.55; }
  .brand { margin-top: 24px; font: 600 12px 'Sora', sans-serif; color: #AD9060; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">{{ icon_lock(20,20) }}</div>
    <h1>Enlace expirado</h1>
    <p>Este enlace compartido ya no está disponible. Solicita al despacho un nuevo enlace de acceso.</p>
    <div class="brand">Habeas Corpus</div>
  </div>
</body>
</html>
