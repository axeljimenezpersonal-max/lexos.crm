<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/favicon.svg') }}">
<title>{{ documento.titulo }} — {{ tenant.nombre_despacho if tenant else 'Habeas Corpus' }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #F8F6F2; color: #142E59; line-height: 1.7; }
  .header { background: #FCFAF7; border-bottom: 1px solid #E5E2DB; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .header-title { font: 600 15px 'Sora', sans-serif; color: #142E59; }
  .header-sub { font-size: 13px; color: #60718D; overflow-wrap: anywhere; }
  .badge { font: 600 12px 'Inter', sans-serif; padding: 4px 11px; border-radius: 99px; background: #F4EEDF; border: 1px solid #E2D3AE; color: #6E5A3A; white-space: nowrap; }
  .content { max-width: 800px; margin: 32px auto; background: #fff; border: 1px solid #E5E2DB; border-radius: 14px; padding: 48px 56px; min-height: 60vh; box-shadow: 0 16px 34px -28px rgba(20,46,89,.45); font-size: 15px; color: #26354D; overflow-wrap: anywhere; }
  .content h1, .content h2, .content h3 { font-family: 'Sora', sans-serif; font-weight: 600; color: #142E59; line-height: 1.3; }
  .content h1 { font-size: 1.6rem; margin-bottom: 12px; }
  .content h2 { font-size: 1.3rem; margin-bottom: 10px; }
  .content h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .content p { margin-bottom: 10px; }
  .content blockquote { border-left: 3px solid #AD9060; padding-left: 12px; color: #60718D; margin: 12px 0; }
  .content table { border-collapse: collapse; width: 100%; margin: 12px 0; display: block; overflow-x: auto; }
  .content th, .content td { border: 1px solid #E5E2DB; padding: 8px 10px; text-align: left; }
  .content th { background: #FAF8F4; font-weight: 600; }
  .content img { max-width: 100%; border-radius: 6px; }
  .footer { text-align: center; padding: 24px; font-size: 12.5px; color: #60718D; }
  @media (max-width: 700px) {
    .content { padding: 24px 18px; margin: 16px; }
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-title">{{ tenant.nombre_despacho if tenant else 'Habeas Corpus' }}</div>
      <div class="header-sub">Documento compartido: {{ documento.titulo }}</div>
    </div>
    <span class="badge">Solo lectura</span>
  </div>
  <div class="content">
    {{ documento.contenido_html | safe }}
  </div>
  <div class="footer">
    Documento compartido desde Habeas Corpus · Este enlace es temporal y de solo lectura.
  </div>
</body>
</html>
